name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

# Forks default GITHUB_TOKEN to contents:read; reusable flutter-build
# needs contents:write for generate-sbom / nightly release upload.
permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  run-flutter-nightly-build:
    permissions:
      contents: write
      actions: write
      id-token: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
